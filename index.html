<!doctype html><html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokacije"><meta name="theme-color" content="#b3262e">
<title>Lokacije</title>
<style>
:root{--bg:#f6f5f3;--fg:#1d2330;--mut:#6b7280;--card:#fff;--line:#e3e1dc;--acc:#b3262e}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#eceef2;--mut:#98a0ae;--card:#1d222b;--line:#2c3340;--acc:#ef6b73}}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:40;opacity:0;transform:translateY(-60px);pointer-events:none}
#ptr.snap{transition:transform .2s,opacity .2s}
#ptr .sp{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%}
#ptr.spin .sp{animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{display:flex;align-items:center;gap:10px;font-size:26px;margin:4px 0 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1 svg{color:var(--acc);flex:none}
.top{display:flex;justify-content:space-between;align-items:center}
input,button{font:inherit;font-size:17px}
input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none;margin-bottom:8px}
input:focus{border-color:var(--acc)}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:none;color:var(--acc);border:2px solid var(--acc)}
button.d{background:none;color:var(--acc);border:2px solid var(--acc)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);max-width:calc(100% - 28px);padding:12px 18px;border-radius:12px;background:#1f7a4d;color:#fff;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:50;transition:transform .25s;pointer-events:none;text-align:center}
#toast.o{transform:translate(-50%,0)}#toast.err{background:#b3262e}#toast.info{background:#374151}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 2px 4px}
#cf{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
#cf.o{display:flex}
#cb{background:var(--bg);width:100%;max-width:400px;border-radius:18px;padding:18px}
#cb h3{margin:0 0 10px;font-size:18px}
#cs{margin:0 0 16px;font-size:15px}#cs div{display:flex;gap:8px;padding:3px 0}#cs b{color:var(--mut);font-weight:600;min-width:84px}
button.dg{background:var(--acc)}
.s{position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:6px 0 10px;z-index:2}
.c{color:var(--mut);font-size:14px;margin:2px 2px 0}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}
li>div:first-child{flex:1;min-width:0}
.n{font-weight:600}.t,.r{color:var(--mut);font-size:14px}.r{text-align:right}
.i{width:34px;height:34px;padding:0;border-radius:50%;background:none;color:var(--mut);border:1.5px solid var(--line);font-size:16px;font-style:italic;font-family:Georgia,serif;flex:none}
#f{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
#f.o{display:block}#f button{margin-top:6px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:flex-end;justify-content:center}
#ov.o{display:flex}
#sh{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sh h2{margin:0 0 12px;font-size:19px}
.row{display:flex;gap:8px}.row button{flex:1}
.row{margin-top:6px}</style></head><body><main>
<div class="top"><h1 id="home" role="button" tabindex="0" aria-label="Home"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg><span>Lokacije</span></h1><button class="g" id="tg">+ Dodaj</button></div>
<div id="f">
 <label for="d">Država</label><input id="d" list="dl" value="Italija">
 <label for="r">Regija</label><input id="r" list="rl">
 <label for="p">Provincija (neobavezno)</label><input id="p">
 <label for="g">Grad (neobavezno)</label><input id="g">
<div class="row"><button id="sv">Spremi</button><button class="g" id="sc">Odustani</button></div>
 <datalist id="dl"></datalist><datalist id="rl"></datalist>
</div>
<div class="s"><input id="q" type="search" placeholder="Upiši grad, provinciju ili regiju" autocomplete="off">
<div class="c" id="c"></div></div>
<ul id="l"></ul>
</main>
<div id="ov"><div id="sh">
 <h2 id="et">Uredi unos</h2>
 <label for="ed">Država</label><input id="ed" list="dl">
 <label for="er">Regija</label><input id="er" list="rl">
 <label for="ep">Provincija (neobavezno)</label><input id="ep">
 <label for="eg">Grad (neobavezno)</label><input id="eg">
 <div class="row"><button id="es">Spremi</button><button class="d" id="edl">Obriši</button><button class="g" id="ec">Zatvori</button></div>
</div></div>
<div id="ptr"><div class="sp"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cf"><div id="cb"><h3 id="ch"></h3><div id="cs"></div>
 <div class="row"><button id="cok">Da</button><button class="g" id="cno">Odustani</button></div></div></div>
<script>
// ====== POSTAVKE ======
const API = "https://script.google.com/macros/s/AKfycbzdyXsnQcjojAhBkOeM21_WEQdeUyNUMWkfbDjReOgOe3UIo4_IpQ2dVnXjfVGVltLv/exec";   // npr. https://script.google.com/macros/s/.../exec
const KEY = "554550";                 // ista kao u Code.gs
// ======================
const $=id=>document.getElementById(id);
function ask(title,v,okText,danger){
 $("ch").textContent=title;
 const L=[["Država",v.drzava],["Regija",v.regija],["Provincija",v.provincija],["Grad",v.grad]];
 $("cs").innerHTML=L.map(([a,b])=>`<div><b>${a}</b><span>${b?esc(b):"\u2014"}</span></div>`).join("");
 $("cok").textContent=okText;$("cf").classList.add("o");
 return new Promise(res=>{
  const end=x=>{$("cf").classList.remove("o");$("cok").onclick=$("cno").onclick=null;res(x)};
  $("cok").onclick=()=>end(true);$("cno").onclick=()=>end(false)})}
const M={"đ":"d","ł":"l","ø":"o","æ":"ae","œ":"oe","ß":"ss","ı":"i","þ":"th","ð":"d"};
const f=s=>String(s).toLowerCase().replace(/[đłøæœßıþð]/g,c=>M[c]).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let rows=JSON.parse(localStorage.getItem("rows")||"[]");   // [država, regija, provincija, grad, redak]
let list=[],cur=null;
const S=v=>v==null?"":String(v);
function entries(){return rows.map(([d,r,p,g,row])=>{d=S(d);r=S(r);p=S(p);g=S(g);return{d,r,p,g,row,k:f([d,r,p,g].join(" "))}})}
function render(){
 const w=f($("q").value.trim()).split(/\s+/).filter(Boolean);
 list=entries().filter(o=>w.every(t=>o.k.includes(t))).sort((a,b)=>(a.g||a.p).localeCompare(b.g||b.p,"hr")).slice(0,300);
 $("l").innerHTML=list.map((o,i)=>{
  const title=o.g||o.p,sub=o.g?(o.p?"Grad \u00b7 prov. "+o.p:"Grad"):"Provincija";
  return `<li><div><div class="n">${esc(title)}</div><div class="t">${esc(sub)}</div></div><div class="r">${esc(o.r)}<br>${esc(o.d)}</div>${o.row?`<button class="i" data-i="${i}" aria-label="Uredi">i</button>`:""}</li>`}).join("");
 if(!rows.length)$("l").innerHTML='<li style="color:var(--mut)">Nema podataka. Provjeri vezu ili postavke skripte.</li>';
 $("c").textContent=list.length+" rezultata";
 $("dl").innerHTML=[...new Set(rows.map(r=>r[0]))].map(x=>`<option value="${esc(x)}">`).join("");
 $("rl").innerHTML=[...new Set(rows.map(r=>r[1]))].map(x=>`<option value="${esc(x)}">`).join("")}
let tt;
function toast(msg,type,ms){const t=$("toast");t.textContent=msg;t.className="o "+(type||"ok");clearTimeout(tt);if(ms!==0)tt=setTimeout(()=>t.className="",ms||3500)}
function call(params,ms){return new Promise((res,rej)=>{
 const cb="cb"+Date.now()+Math.floor(Math.random()*1e6),sc=document.createElement("script");let done=false,to;
 const clean=()=>{done=true;delete window[cb];sc.remove();clearTimeout(to)};
 to=setTimeout(()=>{if(!done){clean();rej(new Error("timeout"))}},ms||25000);
 window[cb]=d=>{clean();res(d)};
 sc.onerror=()=>{if(!done){clean();rej(new Error("net"))}};
 sc.src=API+(API.includes("?")?"&":"?")+new URLSearchParams({...params,callback:cb,_:Date.now()});
 document.head.appendChild(sc)})}
const ptr=$("ptr"),sp=ptr.firstChild;let spinning=false,t0=0;
function spin(on){
 if(on){spinning=true;t0=Date.now();ptr.classList.add("snap","spin");ptr.style.opacity=1;ptr.style.transform="translateY(10px)"}
 else{const w=Math.max(0,600-(Date.now()-t0));setTimeout(()=>{spinning=false;ptr.classList.remove("spin");ptr.style.opacity=0;ptr.style.transform="translateY(-60px)"},w)}}
async function load(){
 spin(true);
 let ok=false;
 try{const j=await call({},8000);if(j&&j.ok){rows=j.rows;ok=true}}catch(e){}
 if(!ok){try{const j=await(await fetch(API)).json();if(j&&j.ok){rows=j.rows;ok=true}}catch(e){}}
 if(ok)localStorage.setItem("rows",JSON.stringify(rows));
 else toast(rows.length?"Offline \u2013 prikazani su spremljeni podaci":"Ne mogu dohvatiti podatke. Provjeri je li nova skripta objavljena.","err",6000);
 render();spin(false);return ok}
const post=v=>call({p:JSON.stringify({...v,key:KEY})});
$("tg").onclick=()=>$("f").classList.toggle("o");
function home(){
 $("q").value="";$("f").classList.remove("o");
 if(cur)close();
 render();window.scrollTo({top:0,behavior:"smooth"});refresh()}
$("home").onclick=home;
$("home").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")home()};
$("sc").onclick=()=>{$("f").classList.remove("o");$("r").value=$("p").value=$("g").value=""};
$("sv").onclick=async()=>{
 const v={action:"add",drzava:$("d").value.trim(),regija:$("r").value.trim(),provincija:$("p").value.trim(),grad:$("g").value.trim()};
 if(!v.drzava||!v.regija||!(v.provincija||v.grad)){toast("Upi\u0161i dr\u017eavu, regiju i barem provinciju ili grad.","err");return}
 if(!await ask("Dodati novi unos?",v,"Da, dodaj"))return;
 toast("Spremam...","info",0);
 try{const j=await post(v);
  if(!j.ok){toast("Gre\u0161ka: "+j.error,"err");return}
  $("p").value="";$("g").value="";toast("Unos je spremljen \u2713");await load()
 }catch(e){toast("Veza nije uspjela. Provjeri je li unos u Sheetu.","err",6000);load()}};
// uređivanje / brisanje
$("l").onclick=e=>{const b=e.target.closest(".i");if(!b)return;
 cur=list[+b.dataset.i];
 $("ed").value=cur.d;$("er").value=cur.r;$("ep").value=cur.p;$("eg").value=cur.g;
 $("ov").classList.add("o")};
const close=()=>{$("ov").classList.remove("o");cur=null};
$("ec").onclick=close;
$("ov").onclick=e=>{if(e.target.id==="ov")close()};
$("es").onclick=async()=>{
 const v={action:"edit",row:cur.row,oldP:cur.p,oldG:cur.g,drzava:$("ed").value.trim(),regija:$("er").value.trim(),provincija:$("ep").value.trim(),grad:$("eg").value.trim()};
 if(!v.drzava||!v.regija||!(v.provincija||v.grad)){toast("Upi\u0161i dr\u017eavu, regiju i barem provinciju ili grad.","err");return}
 if(!await ask("Spremiti promjene?",v,"Da, spremi"))return;
 toast("Spremam...","info",0);
 try{const j=await post(v);if(!j.ok){toast("Gre\u0161ka: "+j.error,"err");return}
  close();toast("Promjene su spremljene \u2713");await load()}catch(e){toast("Veza nije uspjela. Provjeri je li promjena u Sheetu.","err",6000);load()}};
$("edl").onclick=async()=>{
 if(!await ask("Obrisati ovaj unos?",{drzava:cur.d,regija:cur.r,provincija:cur.p,grad:cur.g},"Da, obri\u0161i"))return;
 toast("Bri\u0161em...","info",0);
 try{const j=await post({action:"delete",row:cur.row,oldP:cur.p,oldG:cur.g});
  if(!j.ok){toast("Gre\u0161ka: "+j.error,"err");return}
  close();toast("Unos je obrisan \u2713");await load()}catch(e){toast("Veza nije uspjela. Provjeri je li unos obrisan u Sheetu.","err",6000);load()}};
let y0=null,pull=0;
const modalOpen=()=>$("ov").classList.contains("o")||$("cf").classList.contains("o");
document.addEventListener("touchstart",e=>{y0=(window.scrollY<=0&&!modalOpen()&&!spinning)?e.touches[0].clientY:null;pull=0;ptr.classList.remove("snap")},{passive:true});
document.addEventListener("touchmove",e=>{
 if(y0===null)return;
 pull=e.touches[0].clientY-y0;
 if(pull>0&&window.scrollY<=0){
  const d=Math.min(pull,140)*0.55;
  ptr.style.opacity=Math.min(pull/60,1);ptr.style.transform="translateY("+(d-40)+"px)";
  sp.style.transform="rotate("+pull*3+"deg)"}
 else{pull=0}},{passive:true});
document.addEventListener("touchend",()=>{
 if(y0===null)return;y0=null;ptr.classList.add("snap");sp.style.transform="";
 if(pull>75){refresh().then(ok=>{if(ok)toast("Osvje\u017eeno \u2713","ok",1500)})}
 else{ptr.style.opacity=0;ptr.style.transform="translateY(-60px)"}pull=0});
$("q").addEventListener("input",render);
render();load();
// automatsko osvježavanje: kad se vratiš u app (min. 1 min razmaka) i svakih sat vremena
let last=Date.now();
const refresh=()=>{last=Date.now();return load()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-last>60000)refresh()});
window.addEventListener("pageshow",()=>{if(Date.now()-last>60000)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},3600000);
</script></body></html>
