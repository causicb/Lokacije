<!doctype html><html lang="hr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lokacije"><meta name="theme-color" content="#b3262e">
<title>Lokacije</title>
<style>
:root{--bg:#f6f5f3;--fg:#1d2330;--mut:#6b7280;--card:#fff;--line:#e3e1dc;--acc:#b3262e}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#eceef2;--mut:#98a0ae;--card:#1d222b;--line:#2c3340;--acc:#ef6b73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:4px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center}
input,button{font:inherit;font-size:17px}
input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none;margin-bottom:8px}
input:focus{border-color:var(--acc)}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:none;color:var(--acc);border:2px solid var(--acc)}
button.d{background:none;color:var(--acc);border:2px solid var(--acc)}
button.d.on{background:var(--acc);color:#fff}
.s{position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:6px 0 10px;z-index:2}
.c{color:var(--mut);font-size:14px;margin:2px 2px 0}
ul{list-style:none;margin:6px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}
li>div:first-child{flex:1;min-width:0}
.n{font-weight:600}.t,.r{color:var(--mut);font-size:14px}.r{text-align:right}
.i{width:34px;height:34px;padding:0;border-radius:50%;background:none;color:var(--mut);border:1.5px solid var(--line);font-size:16px;font-style:italic;font-family:Georgia,serif;flex:none}
#f{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
#f.o{display:block}.m{min-height:20px;font-size:14px;color:var(--mut);margin:6px 0 10px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:flex-end;justify-content:center}
#ov.o{display:flex}
#sh{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sh h2{margin:0 0 12px;font-size:19px}
.row{display:flex;gap:8px}.row button{flex:1}
</style></head><body><main>
<div class="top"><h1>Lokacije</h1><button class="g" id="tg">+ Dodaj</button></div>
<div id="f">
 <input id="d" list="dl" placeholder="Država" value="Italija">
 <input id="r" list="rl" placeholder="Regija">
 <input id="p" placeholder="Provincija (neobavezno)">
 <input id="g" placeholder="Grad (neobavezno)">
 <div class="m" id="m"></div><button id="sv">Spremi</button>
 <datalist id="dl"></datalist><datalist id="rl"></datalist>
</div>
<div class="s"><input id="q" type="search" placeholder="Upiši grad, provinciju ili regiju" autocomplete="off">
<div class="c" id="c"></div></div>
<ul id="l"></ul>
</main>
<div id="ov"><div id="sh">
 <h2 id="et">Uredi unos</h2>
 <input id="ed" list="dl" placeholder="Država">
 <input id="er" list="rl" placeholder="Regija">
 <input id="ep" placeholder="Provincija (neobavezno)">
 <input id="eg" placeholder="Grad (neobavezno)">
 <div class="m" id="em"></div>
 <div class="row"><button id="es">Spremi</button><button class="d" id="edl">Obriši</button><button class="g" id="ec">Zatvori</button></div>
</div></div>
<script>
// ====== POSTAVKE ======
const API = "https://script.google.com/macros/s/AKfycbwUmcQ-g9LRfxta27cj4Gf2nXBGhIMr6eT5pKm48ZIbXS_g8TLouw36fZCj4aCNEJGg/exec";   // npr. https://script.google.com/macros/s/.../exec
const KEY = "554550";                 // ista kao u Code.gs
// ======================
const $=id=>document.getElementById(id);
const M={"đ":"d","ł":"l","ø":"o","æ":"ae","œ":"oe","ß":"ss","ı":"i","þ":"th","ð":"d"};
const f=s=>String(s).toLowerCase().replace(/[đłøæœßıþð]/g,c=>M[c]).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let rows=JSON.parse(localStorage.getItem("rows")||"[]");   // [država, regija, provincija, grad, redak]
let list=[],cur=null;
const S=v=>v==null?"":String(v);
function entries(){return rows.map(([d,r,p,g,row])=>{d=S(d);r=S(r);p=S(p);g=S(g);return{d,r,p,g,row,k:f([d,r,p,g].join(" "))}})}
function render(){
 const w=f($("q").value.trim()).split(/\s+/).filter(Boolean);
 list=entries().filter(o=>w.every(t=>o.k.includes(t))).sort((a,b)=>(a.g||a.p).localeCompare(b.g||b.p,"hr")).slice(0,300);
 $("l").innerHTML=list.map((o,i)=>{
  const title=o.g||o.p,sub=o.g?(o.p?"Grad \u00b7 prov. "+o.p:"Grad"):"Provincija";
  return `<li><div><div class="n">${esc(title)}</div><div class="t">${esc(sub)}</div></div><div class="r">${esc(o.r)}<br>${esc(o.d)}</div>${o.row?`<button class="i" data-i="${i}" aria-label="Uredi">i</button>`:""}</li>`}).join("");
 $("c").textContent=list.length+" rezultata";
 $("dl").innerHTML=[...new Set(rows.map(r=>r[0]))].map(x=>`<option value="${esc(x)}">`).join("");
 $("rl").innerHTML=[...new Set(rows.map(r=>r[1]))].map(x=>`<option value="${esc(x)}">`).join("")}
async function load(){
 try{const j=await(await fetch(API)).json();if(j.ok){rows=j.rows;localStorage.setItem("rows",JSON.stringify(rows))}}
 catch(e){$("c").textContent="Offline - prikazani spremljeni podaci"}
 render()}
async function post(v){
 const j=await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...v,key:KEY})})).json();return j}
$("tg").onclick=()=>$("f").classList.toggle("o");
$("sv").onclick=async()=>{
 const v={action:"add",drzava:$("d").value.trim(),regija:$("r").value.trim(),provincija:$("p").value.trim(),grad:$("g").value.trim()};
 if(!v.drzava||!v.regija||!(v.provincija||v.grad)){$("m").textContent="Upiši državu, regiju i barem provinciju ili grad.";return}
 $("m").textContent="Spremam...";
 try{const j=await post(v);
  if(!j.ok){$("m").textContent="Greška: "+j.error;return}
  $("p").value="";$("g").value="";$("m").textContent="Spremljeno.";await load()
 }catch(e){$("m").textContent="Nije uspjelo spremanje. Provjeri internet i postavke."}};
// uređivanje / brisanje
$("l").onclick=e=>{const b=e.target.closest(".i");if(!b)return;
 cur=list[+b.dataset.i];
 $("ed").value=cur.d;$("er").value=cur.r;$("ep").value=cur.p;$("eg").value=cur.g;
 $("em").textContent="";$("edl").textContent="Obri\u0161i";$("edl").classList.remove("on");$("ov").classList.add("o")};
const close=()=>{$("ov").classList.remove("o");cur=null};
$("ec").onclick=close;
$("ov").onclick=e=>{if(e.target.id==="ov")close()};
$("es").onclick=async()=>{
 const v={action:"edit",row:cur.row,oldP:cur.p,oldG:cur.g,drzava:$("ed").value.trim(),regija:$("er").value.trim(),provincija:$("ep").value.trim(),grad:$("eg").value.trim()};
 if(!v.drzava||!v.regija||!(v.provincija||v.grad)){$("em").textContent="Upi\u0161i dr\u017eavu, regiju i barem provinciju ili grad.";return}
 $("em").textContent="Spremam...";
 try{const j=await post(v);if(!j.ok){$("em").textContent="Gre\u0161ka: "+j.error;return}
  close();await load()}catch(e){$("em").textContent="Nije uspjelo. Provjeri internet."}};
$("edl").onclick=async()=>{
 if(!$("edl").classList.contains("on")){$("edl").classList.add("on");$("edl").textContent="Potvrdi brisanje";return}
 $("em").textContent="Bri\u0161em...";
 try{const j=await post({action:"delete",row:cur.row,oldP:cur.p,oldG:cur.g});
  if(!j.ok){$("em").textContent="Gre\u0161ka: "+j.error;return}
  close();await load()}catch(e){$("em").textContent="Nije uspjelo. Provjeri internet."}};
$("q").addEventListener("input",render);
render();load();
// automatsko osvježavanje: kad se vratiš u app (min. 1 min razmaka) i svakih sat vremena
let last=Date.now();
const refresh=()=>{last=Date.now();load()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-last>60000)refresh()});
window.addEventListener("pageshow",()=>{if(Date.now()-last>60000)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},3600000);
</script></body></html>
